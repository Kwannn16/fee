<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/register.css" />
  </head>
  <body>
    <main>
      <section class="register flex justify-center items-center min-h-screen">
        <form
          id="register-form"
          class="register-form mx-auto shadow bg-white px-10 py-8 rounded-[10px] w-[623px] h-[681px] text-center"
          autocomplete="off"
        >
          <h2 class="form-title mb-4 font-bold text-[2.2rem]">Register</h2>
          <div class="flex mb-3 gap-4">
            <div class="w-1/2 text-left">
              <label for="firstName" class="form-label block mb-1">First Name</label>
              <input type="text" name="firstName" id="firstName" class="form-control block w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Enter your first name" required />
            </div>
            <div class="w-1/2 text-left">
              <label for="lastName" class="form-label block mb-1">Last Name</label>
              <input type="text" name="lastName" id="lastName" class="form-control block w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Enter your last name" required />
            </div>
          </div>
          <div class="mb-3 text-left">
            <label for="email" class="form-label block mb-1">Email Address</label>
            <input type="email" name="email" id="email" class="form-control block w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Enter your email" required />
          </div>
          <div class="flex mb-3 gap-4">
            <div class="w-1/2 text-left">
              <label for="username" class="form-label block mb-1">Username</label>
              <input type="text" name="username" id="username" class="form-control block w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Enter your username" required />
            </div>
            <div class="w-1/2 text-left">
              <label for="phone" class="form-label block mb-1">Phone Number</label>
              <input type="text" name="phone" id="phone" class="form-control block w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Enter your phone number" />
            </div>
          </div>
          <div class="mb-3 text-left">
            <label for="password" class="form-label block mb-1">Password</label>
            <input type="password" name="password" id="password" class="form-control block w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Enter your password" required />
          </div>
          <div class="mb-3 text-left">
            <label for="confirmPassword" class="form-label block mb-1">Confirm Password</label>
            <input type="password" name="confirmPassword" id="confirmPassword" class="form-control block w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Confirm your password" required />
          </div>
          <div class="flex flex-row gap-2 my-3 items-center">
            <div class="w-1/2 text-left">
              <a href="#" class="back-home text-[22px] text-[#222] no-underline font-sans">Back to Home</a>
            </div>
            <div class="w-1/2 text-right">
              <button type="submit" class="btn-register btn w-full bg-[#38b6ff] text-white border-none py-2 rounded-[6px] cursor-pointer text-[20px] transition-colors duration-200 hover:bg-[#009ee3]">Register</button>
            </div>
          </div>
          <div class="extra-links mt-2 text-[16px] text-[#444]">
            <p class="mt-[6px]">Already have an account? <a href="#" class="no-underline text-[#333]">Login</a></p>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
